name: CI Pipeline

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh --eval "db.adminCommand('ping')"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: stayora-backend/package-lock.json

      - name: Install dependencies
        working-directory: stayora-backend
        run: npm ci

      - name: Type check
        working-directory: stayora-backend
        run: npm run typecheck

      - name: Run tests
        working-directory: stayora-backend
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret
          MONGODB_URI: mongodb://localhost:27017/stayora_test
          TURNSTILE_SECRET_KEY: test-turnstile-key
          MFA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          KHALTI_SECRET_KEY: test-khalti-key
          KHALTI_VERIFY_URL: https://khalti.com/api/v2/payment/verify/
          CLIENT_URL: http://localhost:3000

      - name: Check dependency vulnerabilities
        working-directory: stayora-backend
        run: npm audit --audit-level=high
        continue-on-error: true

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: stayora-frontend/package-lock.json

      - name: Install dependencies
        working-directory: stayora-frontend
        run: npm ci

      - name: Lint
        working-directory: stayora-frontend
        run: npm run lint

      - name: Build
        working-directory: stayora-frontend
        run: npm run build

      - name: Run tests
        working-directory: stayora-frontend
        run: npm test

      - name: Check dependency vulnerabilities
        working-directory: stayora-frontend
        run: npm audit --audit-level=high
        continue-on-error: true

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@v3
        with:
          extra_args: --only-verified
